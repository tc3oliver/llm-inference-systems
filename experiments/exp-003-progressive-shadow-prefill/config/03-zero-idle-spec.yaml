# EXP-003 validation round — zero-idle coding-agent geometry, arm A of a pair.
#
# The question this pair closes is the one METHODOLOGY.md leaves open: every
# earlier round gave the session an idle gap, and EXP-001 measured that real
# coding-agent turns leave little or none. `append-heavy-80k.yaml` is the
# tracked shape whose gaps are all zero.
#
# Arm A is SpecPrefill with no background recovery. Its partner is
# `03-zero-idle-pcsr.yaml`, which differs in the three shadow settings and in
# nothing else. The two are run in separate server sessions with the cache
# directory removed between them, which is how METHODOLOGY.md separates arms;
# `cache_clear` is off here because clearing before every turn would remove the
# prefix reuse the pair exists to measure.
exp: exp-003-zero-idle
model: Qwen3.8-27B-oQ4e-mtp
reload_on_change: true
defaults:
  endpoint: openai
  temperature: 0
  seed: 3
  repeats: 1
  cache_clear: false
  record_output: true
cells:
  - name: spec
    shadow: {arm: spec, budget_pct: 0}
    settings:
      specprefill_enabled: true
      specprefill_draft_model: mlx-community/Qwen3.5-0.8B-MLX-4bit
      specprefill_threshold: 8192
      mtp_enabled: false
      shadow_prefill_enabled: false
    workload:
      shape: workloads/shapes/append-heavy-80k.yaml
      seed: 301
