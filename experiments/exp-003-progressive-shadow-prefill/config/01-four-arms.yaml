# EXP-003 — the four required arms over one append-heavy session shape.
#
# Shadow-End exists to isolate the value of progressive publication from the
# value of background recovery itself. Without it, a PASS result cannot be told
# apart from "any background dense recovery would have done this".
exp: exp-003
model: Qwen3.8-27B-oQ4e-mtp
reload_on_change: true
defaults:
  endpoint: openai
  temperature: 0
  seed: 3
  repeats: 1
  cache_clear: true
  record_output: true
  workload:
    shape: workloads/shapes/append-heavy-80k.yaml
    seed: 301
cells:
  - name: dense
    shadow: {arm: dense, budget_pct: 0}
    settings:
      specprefill_enabled: false
      shadow_prefill_enabled: false

  - name: spec
    shadow: {arm: spec, budget_pct: 0}
    settings:
      specprefill_enabled: true
      shadow_prefill_enabled: false

  - name: shadow-end
    shadow: {arm: shadow-end, budget_pct: 10}
    settings:
      specprefill_enabled: true
      shadow_prefill_enabled: true
      shadow_prefill_publish_mode: terminal
      shadow_prefill_budget_pct: 10

  - name: pass
    shadow: {arm: pass, budget_pct: 10}
    settings:
      specprefill_enabled: true
      shadow_prefill_enabled: true
      shadow_prefill_publish_mode: progressive
      shadow_prefill_budget_pct: 10
