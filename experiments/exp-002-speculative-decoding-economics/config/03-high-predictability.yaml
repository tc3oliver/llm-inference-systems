exp: exp-002
model: Qwen3.6-35B-A3B-oQ6-mtp
reload_on_change: true
defaults:
  endpoint: openai
  max_tokens: 256
  temperature: 0
  seed: 7
  repeats: 2
  cache_clear: true
  record_output: true
cells:
  - name: adaptive/copy/short
    settings: {mtp_enabled: true, mtp_num_draft_tokens: 3}
    warmup: 1
    workload:
      prompt_tokens: 3000
      kind: code
      seed: 101
      instruction: "Reproduce the last forty lines of the module above verbatim, character for character, exactly as written. Output code only, no commentary."
  - name: dense/copy/short
    settings: {mtp_enabled: false}
    warmup: 1
    workload:
      prompt_tokens: 3000
      kind: code
      seed: 101
      instruction: "Reproduce the last forty lines of the module above verbatim, character for character, exactly as written. Output code only, no commentary."
