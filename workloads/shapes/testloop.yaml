  - {add_tokens: 900,  kind: prose, output_max_tokens: 500, idle_s: 8}
  - {add_tokens: 900,  kind: code,  output_max_tokens: 600, idle_s: 8}
  - {add_tokens: 900,  kind: prose, output_max_tokens: 500, idle_s: 8}
  - {add_tokens: 900,  kind: code,  output_max_tokens: 600, idle_s: 8}
  - {add_tokens: 900,  kind: prose, output_max_tokens: 500, idle_s: 8}
