[project]
name = "llm-inference-systems"
version = "0.1.0"
description = "Research harness and analysis code for local LLM inference experiments."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Optional: exact token-length targeting in workloads/generator.py.
# Without it the generator falls back to 4 chars/token and flags `approx`.
tokenizer = ["transformers>=4.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "analysis", "workloads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
